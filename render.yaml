# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: nickflix
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Paste the secret NickFlix Host prints on your PC the first time it runs.
      - key: HOST_SECRET
        sync: false
